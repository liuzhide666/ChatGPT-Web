name: abi-probe-experiment
on:
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'tools/arm64-probe-only.init.gradle'
      - 'tools/verify_probe_arm64.py'
      - 'tests/test_probe_arm64_packaging.py'
      - '.github/workflows/abi-probe-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-debug-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify Gradle Wrapper and dependency lock
        run: |
          python3 tools/verify_gradle_wrapper.py
          python3 tools/verify_gradle_dependencies.py
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '9.3.1'
      - name: Build universal debug probe control
        run: |
          ./gradlew --no-daemon :app:assembleProbeDebug
          find app/build/outputs/apk/probe/debug -maxdepth 1 -name '*.apk' -type f
          cp app/build/outputs/apk/probe/debug/*.apk "$RUNNER_TEMP/universal-probe-debug.apk"
      - name: Build opt-in ARM64-only debug probe
        run: ./gradlew --no-daemon -I tools/arm64-probe-only.init.gradle clean :app:assembleProbeDebug
      - name: Verify full APK integrity, ABI and measured reduction
        run: |
          python3 tools/verify_probe_arm64.py \
            "$RUNNER_TEMP/universal-probe-debug.apk" \
            app/build/outputs/apk/probe/debug/app-probe-debug.apk \
            --output "$RUNNER_TEMP/arm64-size-report.json"
      - name: Upload size audit only (no APK)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-probe-size-audit-${{ github.sha }}
          path: ${{ runner.temp }}/arm64-size-report.json
          if-no-files-found: error
          retention-days: 14
# Builds are unsigned-for-release debug probes; no installation or ABI compatibility is asserted.
