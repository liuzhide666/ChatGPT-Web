name: android-build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android API 37 and Build Tools 36
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify pinned Gradle Wrapper
        run: python3 tools/verify_gradle_wrapper.py
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '9.3.1'
      - name: Inspect toolchain
        run: |
          java -version
          javac -version
          ./gradlew --version
          bash tools/resolve_android_toolchain.sh
          test -f "$ANDROID_HOME/build-tools/36.0.0/aapt2" || test -f "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Run Java Host contracts
        run: bash tools/run_all_host_tests.sh
      - name: Compile Android API 37 contracts
        run: bash tools/compile_api37_contract.sh
      - name: Verify committed Gradle dependency hashes
        run: python3 tools/verify_gradle_dependencies.py
      - name: Assemble unsigned-release-compatible debug probe
        run: ./gradlew --no-daemon --stacktrace :app:assembleProbeDebug
      - name: Record nonsecret probe APK SHA-256
        run: python3 tools/record_debug_apk.py app/build/outputs/apk/probe/debug/
      - name: Measure native ABI and 16KiB compatibility indicators
        run: python3 tools/analyze_probe_apk.py app/build/outputs/apk/probe/debug/ --check-zipalign --output "$RUNNER_TEMP/probe-apk-abi-report.json"
# No production signing data. Debug APK is not uploaded as a release artifact.
